name: Build Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build release APK
        run: ./gradlew :app:assembleSideloadRelease --no-daemon

      - name: Verify universal ABI coverage
        shell: bash
        run: |
          apk="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          unzip -l "$apk" > "$RUNNER_TEMP/arvio-apk-entries.txt"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -q "lib/$abi/" "$RUNNER_TEMP/arvio-apk-entries.txt" || {
              echo "Universal APK is missing ABI: $abi" >&2
              exit 1
            }
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-release-apk
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
